spring.application.name=101-subscription-saas
server.port=${PORT\:8103}\n
spring.datasource.url=jdbc\:h2\:file\:./data/saasdb\n
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa\n
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update\n
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true\n
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false\n
spring.h2.console.enabled=true\n
spring.h2.console.path=/h2-console\n
spring.cache.type=caffeine\n
spring.cache.caffeine.spec=maximumSize\=1000,expireAfterAccess\=600s,recordStats\n
